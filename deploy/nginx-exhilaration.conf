# EXHILARATION を nginx で配信する設定例（ラズパイ向け）
#
#   sudo cp deploy/nginx-exhilaration.conf /etc/nginx/sites-available/exhilaration
#   sudo ln -sf /etc/nginx/sites-available/exhilaration /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ゲーム本体は /var/www/exhilaration に置く想定です。

server {
    listen 80;
    listen [::]:80;
    server_name exhilaration.local _;

    root /var/www/exhilaration;
    index index.html;

    # .webmanifest を正しい MIME で返す（PWA のインストールに必須）
    types {
        application/manifest+json  webmanifest;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # Service Worker は常に取り直す（更新が反映されなくなるのを防ぐ）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
